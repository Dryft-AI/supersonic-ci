name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - name: Check dist is up to date
        run: |
          pnpm build
          git diff --exit-code -- check/dist record/dist \
            || { echo "::error::dist is stale, run pnpm build and commit it"; exit 1; }

  first-check:
    runs-on: ubuntu-latest
    outputs:
      hash: ${{ steps.check.outputs.self-hash }}
      passed: ${{ steps.check.outputs.self-passed }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        uses: ./check
        with:
          lanes: |
            self: [src, check, record]
          salt: e2e-${{ github.run_id }}-${{ github.run_attempt }}

  record:
    needs: first-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./record
        with:
          lane: self
          hash: ${{ needs.first-check.outputs.hash }}
      - run: echo "the job's real work would run here"

  second-check:
    needs: [first-check, record]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: check
        uses: ./check
        with:
          lanes: |
            self: [src, check, record]
          salt: e2e-${{ github.run_id }}-${{ github.run_attempt }}
      - name: The first check ran, the record landed, the second check skips
        run: |
          test "${{ needs.first-check.outputs.passed }}" = "false"
          test "${{ steps.check.outputs.self-hash }}" = "${{ needs.first-check.outputs.hash }}"
          test "${{ steps.check.outputs.self-passed }}" = "true"
